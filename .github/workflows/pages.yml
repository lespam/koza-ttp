name: Publicar sitio estático

# Genera el sitio estático (manage.py generar_estatico) y lo publica en GitHub Pages.
# Solo corre a mano: Actions → "Publicar sitio estático" → Run workflow.
# Un push o un merge a main NO publica.
#
# Proceso: en tu computadora corres los experimentos (por ejemplo
# manage.py precalcular_demo), que guardan sus datos en static/data/. Subes esos
# cambios a main y después corres esta acción.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-24.04
    env:
      SECRET_KEY: solo-para-generar
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar Graphviz (lo necesita pygraphviz)
        run: sudo apt-get update && sudo apt-get install -y graphviz libgraphviz-dev
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Compilar traducciones
        run: python manage.py translate_site --compile-only
      - name: Base de datos vacía (solo para generar)
        run: python manage.py migrate --noinput
      - name: Generar el sitio
        run: python manage.py generar_estatico --dominio koza-ttp.lesliedickinson.dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio_estatico

  publicar:
    needs: generar
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - id: publicar
        uses: actions/deploy-pages@v4
