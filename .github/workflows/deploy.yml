name: Deploy

# Publica en la VM de Azure (deploy/deploy.sh) solo cuando se ejecuta a mano:
# Actions → Deploy → Run workflow. Un push o un merge a main NO publica.
# Secretos del repositorio: VM_HOST (IP de la VM) y VM_SSH_KEY (llave privada koza_ttp_azure).
on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy over SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          if [ -z "$VM_HOST" ] || [ -z "$VM_SSH_KEY" ]; then
            echo "::error::Faltan los secretos VM_HOST / VM_SSH_KEY; no se publicó nada."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 ubuntu@"$VM_HOST" 'bash /srv/koza-ttp/deploy/deploy.sh'
