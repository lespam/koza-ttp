# certbot añade el bloque HTTPS (443) y la redirección desde HTTP
server {
    listen 80;
    server_name koza-ttp.lesliedickinson.dev www.koza-ttp.lesliedickinson.dev;

    client_max_body_size 10M;

    location /static/ {
        alias /srv/koza-ttp/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /srv/koza-ttp/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Una corrida de programación genética puede tardar varios minutos
        proxy_read_timeout 900s;
    }
}
