<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<nav class="admin-volver" aria-label="Principal"><a href="/">Koza-TTP</a> · <a href="/guia/">Guía</a> · <a href="/demo/">Demo</a></nav>
<main>
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>
                    {{ message }}
                </li>
            {% endfor %}
        </ul>
    {% endif %}
    <form method="post">{% csrf_token %}
        <h2>Elimminar Liga</h2>
        <p>¿Está seguro de eliminar "{{ object.nickname }}"?</p>
        {{ form }}
        <input type="submit" value="Confirmar">
        <a href="{% url 'tesis:liga_list' %}">Cancelar</a>
    </form>
</main>
</body>
</html>
