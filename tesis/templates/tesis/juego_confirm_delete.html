<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <title>juego</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>
<nav class="admin-volver" aria-label="Principal"><a href="/">Koza-TTP</a> · <a href="/guia/">Guía</a> · <a href="/demo/">Demo</a></nav>
<main>
    <h1>Eliminar juego</h1>
    
    {% if messages %}
    <ul class="messages">
      {% for message in messages %}
        {% if message.tags %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endif %}
      {% endfor %}
    </ul>
    {% endif %}

    <h2>Formulario de eliminacion</h2>
    <form method="post">{% csrf_token %}
        <h2>Eliminar juego</h2>
        <p>¿Está seguro de eliminar el juego {{ juego }}?</p>
        <input type="submit" value="Eliminar">
    </form>
</main>
</body>
</html>
